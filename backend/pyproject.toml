[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-bagu-backend"
version = "0.1.0"
description = "Realtime interview orchestration core for Anti-Bagu"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<48",
  "fastapi>=0.115,<1",
  "openai>=2,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.34,<1",
  "websockets>=14,<16"
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1"
]
lint = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
